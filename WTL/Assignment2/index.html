<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BookNest | Single Page Book Store</title>

    <!-- ✅ EXTERNAL CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- ✅ INTERNAL CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e5f5, #ede7f6);
        }

        /* HEADER */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            background: rgba(74, 20, 140, 0.95);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav a {
            color: white;
            margin-left: 25px;
            text-decoration: none;
            font-weight: 500;
        }

        /* HERO */
        .hero {
            height: 100vh;
            background: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f") center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 50px;
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        .hero-box h1 {
            font-size: 50px;
        }

        /* BOOK SECTION */
        .books {
            padding: 120px 60px;
        }

        .books h2 {
            text-align: center;
            margin-bottom: 40px;
            color: #4a148c;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .book {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .book:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .book img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

        .price {
            color: #7b1fa2;
            font-weight: 700;
        }

        /* BUTTON */
        button {
            margin-top: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        /* CART */
        .cart {
            background: linear-gradient(to right, #7b1fa2, #4a148c);
            color: white;
            padding: 80px 40px;
        }

        .cart-box {
            background: white;
            color: black;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        /* FOOTER */
        footer {
            background: #1b1b1b;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2><i class="fa-solid fa-book"></i> BookNest</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#books">Books</a>
            <a href="#cart">Cart (<span id="count">0</span>)</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero" id="home">
        <div class="hero-box">
            <h1>Discover Your Next Book</h1>
            <p>Read more. Learn more. Grow more.</p>
            <!-- ✅ INLINE CSS -->
            <button onclick="document.getElementById('books').scrollIntoView({behavior:'smooth'})"
                style="background:#ff9800;color:white;font-size:16px;">
                Explore Books
            </button>
        </div>
    </section>

    <!-- BOOKS -->
    <section class="books" id="books">
        <h2>📚 Popular Books</h2>
        <div class="book-grid">

            <div class="book">
                <img src="https://m.media-amazon.com/images/I/91bYsX41DVL.jpg">
                <h3>Atomic Habits</h3>
                <p class="price">₹399</p>
                <button onclick="addToCart('Atomic Habits',399)" style="background:#7b1fa2;color:white;">
                    Add to Cart
                </button>
            </div>

            <div class="book">
                <img src="https://m.media-amazon.com/images/I/81bsw6fnUiL.jpg">
                <h3>Rich Dad Poor Dad</h3>
                <p class="price">₹299</p>
                <button onclick="addToCart('Rich Dad Poor Dad',299)" style="background:#7b1fa2;color:white;">
                    Add to Cart
                </button>
            </div>

            <div class="book">
                <img src="https://m.media-amazon.com/images/I/41xShlnTZTL.jpg">
                <h3>Clean Code</h3>
                <p class="price">₹699</p>
                <button onclick="addToCart('Clean Code',699)" style="background:#7b1fa2;color:white;">
                    Add to Cart
                </button>
            </div>

        </div>
    </section>

    <!-- CART -->
    <section class="cart" id="cart">
        <h2 style="text-align:center;">🛒 Your Cart</h2>
        <div class="cart-box">
            <ul id="cartItems"></ul>
            <hr>
            <h3>Total: ₹<span id="total">0</span></h3>
        </div>
    </section>

    <footer>
        <p>© 2026 BookNest | Single Page UI</p>
    </footer>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById("count").innerText = cart.length;
            updateCart();
        }

        function updateCart() {
            let list = document.getElementById("cartItems");
            let total = 0;
            list.innerHTML = "";
            cart.forEach(item => {
                let li = document.createElement("li");
                li.innerHTML = `${item.name} <b>₹${item.price}</b>`;
                list.appendChild(li);
                total += item.price;
            });
            document.getElementById("total").innerText = total;
        }
    </script>

</body>

</html>
